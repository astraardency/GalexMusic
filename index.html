<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galex - Select Platform</title>
    <style>
        /* General Styles */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        h1 { color: #333; margin-bottom: 10px; text-align: center; }
        .status-text { color: #666; margin-bottom: 40px; height: 20px; font-weight: 500;}

        /* Card Container */
        .card-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 30px;
            max-width: 1200px;
            width: 100%;
        }

        /* Card Styles */
        .card {
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 300px;
            padding: 30px;
            text-align: center;
            transition: all 0.3s ease;
            position: relative;
            /* Changed from 0.5 to 1 so they are always visible */
            opacity: 1; 
            border: 2px solid transparent;
        }

        /* Hover Effect instead of Auto-Detect Active State */
        .card:hover {
            transform: scale(1.05);
            border-color: #007bff;
            box-shadow: 0 15px 30px rgba(0, 123, 255, 0.15);
            z-index: 10;
        }

        .icon { font-size: 4rem; margin-bottom: 20px; display: block; }
        .card h2 { margin: 0 0 10px 0; color: #222; }
        .card p { color: #666; margin-bottom: 25px; }

        /* Buttons */
        .btn {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 6px;
            text-decoration: none;
            display: inline-block;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        
        .btn:hover { background-color: #0056b3; }

        /* Mobile Fixes */
        @media (max-width: 768px) {
            .card { width: 100%; max-width: 350px; }
        }
    </style>
</head>
<body>

    <h1>Select Version</h1>
    <div class="status-text">Choose the interface best suited for your device.</div>

    <div class="card-container">
    
        <div class="card">
            <span class="icon">📱</span>
            <h2>Mobile Web</h2>
            <p>Optimized for touch.</p>
            <a href="mobil.html" class="btn">Go to Mobile</a>
        </div>

        <div class="card">
            <span class="icon">💻</span>
            <h2>PC Web</h2>
            <p>Optimized for desktop.</p>
            <a href="pc.html" class="btn">Go to Desktop</a>
        </div>

        <div class="card">
            <span class="icon">📺</span>
            <h2>Android TV</h2>
            <p>Optimized for remote.</p>
            <a href="android.html" class="btn">Go to TV App</a>
        </div>

    </div>

    </body>
</html>
