<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Galex Mobile</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* --- ANDROID MOBILE RESET & VARIABLES --- */
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-primary: #ffffff;
            --text-secondary: #b3b3b3;
            --accent: #1db954; /* Spotify-like Green */
            --nav-height: 60px;
            --header-height: 60px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent; /* Remove blue tap box on Android */
        }

        body {
            font-family: 'Roboto', -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            overflow-x: hidden;
            padding-bottom: calc(var(--nav-height) + 20px); /* Space for bottom nav */
            padding-top: var(--header-height); /* Space for header */
        }

        /* --- MOBILE HEADER (Top Bar) --- */
        .mobile-header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: var(--header-height);
            background-color: rgba(18, 18, 18, 0.95);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px;
            z-index: 100;
            border-bottom: 1px solid #333;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-area img {
            width: 30px;
            height: 30px;
            border-radius: 50%;
        }

        .logo-area h2 {
            font-size: 1.2rem;
            font-weight: 700;
        }

        /* --- NAVIGATION (Bottom Bar) --- */
        .menu {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: var(--nav-height);
            background-color: #000;
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid #333;
            z-index: 900;
        }

        .menu button {
            background: none;
            border: none;
            color: var(--text-secondary);
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 0.7rem;
            gap: 5px;
            width: 100%;
            padding: 10px 0;
        }

        .menu button i {
            font-size: 1.2rem;
        }

        .menu button.active, .menu button:active {
            color: var(--text-primary);
        }

        /* Hide specific desktop elements */
        .web-name, .loginbtn, .logoutbtn, .verify {
            display: none !important; 
        }

        /* --- SEARCH --- */
        .nav {
            padding: 15px;
        }

        #searchInput {
            width: 100%;
            padding: 12px 20px;
            border-radius: 25px;
            border: none;
            background-color: #333;
            color: white;
            font-size: 1rem;
            outline: none;
        }

        /* --- CONTENT AREA --- */
        .section-title {
            padding: 0 15px;
            margin-bottom: 15px;
            font-size: 1.3rem;
        }

        /* --- ARTIST GRID (2 Columns for Mobile) --- */
        .artistcontainer {
            display: grid;
            grid-template-columns: repeat(2, 1fr); /* 2 cards per row */
            gap: 15px;
            padding: 0 15px;
        }

        .artist-card {
            background-color: var(--card-bg);
            border-radius: 8px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            transition: transform 0.2s;
        }
        .artist-card:hover{
            transform: scale(1.03);

        }

        .artist-card:active {
            transform: scale(0.95);
            background-color: #2a2a2a;
        }

        .artist-image {
            width: 100%;
            aspect-ratio: 1/1;
            object-fit: cover;
            border-radius: 50%; /* Circular images */
            margin-bottom: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }

        .artist-name {
            font-size: 0.9rem;
            font-weight: 600;
        }

        /* --- PLAYER OVERLAY (Full Screen) --- */
        .player-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, #333, #000);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            padding: 20px;
            overflow-y: auto;
            transform: translateY(100%); /* Hidden by default */
            transition: transform 0.3s cubic-bezier(0.2, 0, 0.2, 1);
        }

        .player-container.show {
            transform: translateY(0);
        }

        .player-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .exit-fullscreen-btn {
            background: none;
            border: none;
            color: white;
            font-size: 1.5rem;
            padding: 10px;
        }

        .player-cover-container {
            width: 100%;
            aspect-ratio: 1/1;
            margin-bottom: 30px;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .player-cover {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .player-info {
            margin-bottom: 30px;
        }

        .player-title {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .player-artist {
            color: var(--text-secondary);
            font-size: 1rem;
        }

        /* Controls */
        .player-controls {
            width: 100%;
        }

        .control-buttons {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .control-btn {
            background: none;
            border: none;
            color: white;
            font-size: 1.8rem;
        }

        .play-btn {
            width: 70px;
            height: 70px;
            background-color: white;
            color: black;
            border-radius: 50%;
            font-size: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Progress Bar */
        .progress-container {
            width: 100%;
            margin-bottom: 20px;
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background-color: #444;
            border-radius: 2px;
            position: relative;
        }

        .progress {
            height: 100%;
            background-color: var(--text-primary);
            width: 0%; /* Dynamic */
            border-radius: 2px;
        }

        .time-display {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-top: 8px;
        }

        /* --- AUTH MODALS --- */
        .account {
            display: none; /* JS toggles this */
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login, .signup {
            background: #222;
            padding: 30px;
            border-radius: 15px;
            width: 100%;
            max-width: 400px;
        }
        
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0 20px;
            border-radius: 8px;
            border: 1px solid #444;
            background: #333;
            color: white;
        }

        .form-btn {
            width: 100%;
            padding: 15px;
            background-color: var(--accent);
            color: black;
            font-weight: bold;
            border: none;
            border-radius: 25px;
            font-size: 1rem;
        }

        /* Utility classes */
        .hidden { display: none !important; }
        
        /* Song Lists hidden by default, shown via JS */
        .songs-container { display: none; padding: 15px; }
        .songs-container.active { display: block; }

        .song-item {
            display: flex;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #333;
        }
    </style>
</head>

<body>

    <div class="mobile-header">
        <div class="logo-area">
            <i class="fas fa-music" style="color: var(--accent); font-size: 20px;"></i>
            <h2 id="galexText">Galex</h2>
        </div>
        <div class="user-icon" onclick="document.getElementById('account').style.display = 'flex'">
            <i class="fas fa-user-circle" style="font-size: 24px;"></i>
        </div>
    </div>

    <div class="main">
        
        <div class="mainplayer" id="mainplayer">
            
            <div class="nav">
                <button class="back" id="back" style="display: none; margin-bottom: 15px; background:none; border:none; color:white;">
                    <i class="fas fa-arrow-left"></i> Back
                </button>
                <input type="search" id="searchInput" placeholder="Search songs...">
            </div>

            <div class="content-area">
                <h2 class="section-title" id="currentSection">Featured Artists</h2>

                <div class="artistcontainer" id="artistcontainer">
                    <div class="artist-card" onclick="openPlayerDemo('Hiphop Adhi')">
                        <img src="https://i.pinimg.com/736x/08/bf/f9/08bff9f28c2739618c7837e8f8f183f2.jpg" class="artist-image">
                        <div class="artist-name">Hiphop Adhi</div>
                    </div>
                    <div class="artist-card" onclick="openPlayerDemo('GV Prakash')">
                        <img src="https://i.pinimg.com/736x/44/47/b2/4447b2f0cd4ba7f60a36af71950c2550.jpg" class="artist-image">
                        <div class="artist-name">GV Prakash</div>
                    </div>
                    <div class="artist-card" onclick="openPlayerDemo('Yuvan')">
                        <img src="https://i.pinimg.com/1200x/12/e0/4b/12e04b33175cce5d857eba9b3e6c4f76.jpg" class="artist-image">
                        <div class="artist-name">Yuvan</div>
                    </div>
                    <div class="artist-card" onclick="openPlayerDemo('Aniruth')">
                        <img src="https://i.pinimg.com/736x/c1/ba/a2/c1baa2f6c1773ab419f6e403c1ad7003.jpg" class="artist-image">
                        <div class="artist-name">Aniruth</div>
                    </div>
                    <div class="artist-card" onclick="openPlayerDemo('A R Rahman')">
                        <img src="https://i.pinimg.com/1200x/a1/45/1b/a1451b2311ba7824d9be832e482852fa.jpg" class="artist-image">
                        <div class="artist-name">A R Rahman</div>
                    </div>
                    <div class="artist-card" onclick="openPlayerDemo('Harris Jayaraj')">
                        <img src="https://i.pinimg.com/736x/d5/ab/75/d5ab75a61985722839ef9ecc89a29d38.jpg" class="artist-image">
                        <div class="artist-name">Harris Jayaraj</div>
                    </div>
                </div>

                <div id="settingsContainer" class="hidden" style="padding: 15px;">
                    <h2>Settings</h2>
                    <br>
                    <label>Dark Mode</label>
                    <input type="checkbox" checked disabled> 
                </div>

            </div>
        </div>

        <div class="menu">
            <button class="homebtn active" id="homebtn" onclick="switchTab('home')">
                <i class="fas fa-home"></i> Home
            </button>
            <button class="likedplaylistbtn" id="likedplaylistbtn" onclick="switchTab('liked')">
                <i class="fas fa-heart"></i> Liked
            </button>
            <button class="playlistbtn" id="playlistbtn" onclick="switchTab('playlists')">
                <i class="fas fa-folder"></i> Library
            </button>
            <button class="settingsbtn" id="settingsbtn" onclick="switchTab('settings')">
                <i class="fas fa-cog"></i> Settings
            </button>
        </div>

        <div class="player-container" id="playerContainer">
            <div class="player-header">
                <button class="exit-fullscreen-btn" id="exitFsBtn" onclick="closePlayer()">
                    <i class="fas fa-chevron-down"></i>
                </button>
                <h3>Now Playing</h3>
                <i class="fas fa-ellipsis-v" style="color: white; padding: 10px;"></i>
            </div>
            
            <div class="player-content">
                <div class="player-cover-container">
                    <div style="width:100%; height:100%; background:#333; display:flex; align-items:center; justify-content:center;">
                        <i class="fas fa-music" style="font-size: 50px; color: #555;"></i>
                    </div>
                </div>

                <div class="player-info">
                    <div class="player-title" id="playerTitle">Select a Song</div>
                    <div class="player-artist" id="playerArtist">Artist Name</div>
                </div>

                <div class="player-controls">
                    <div class="progress-container">
                        <div class="progress-bar">
                            <div class="progress" style="width: 30%"></div>
                        </div>
                        <div class="time-display">
                            <span>1:20</span>
                            <span>3:45</span>
                        </div>
                    </div>

                    <div class="control-buttons">
                        <button class="control-btn"><i class="fas fa-random"></i></button>
                        <button class="control-btn"><i class="fas fa-step-backward"></i></button>
                        <button class="play-btn"><i class="fas fa-play"></i></button>
                        <button class="control-btn"><i class="fas fa-step-forward"></i></button>
                        <button class="control-btn"><i class="fas fa-redo"></i></button>
                    </div>
                </div>
            </div>
        </div>

        <div class="account" id="account">
            <div class="login" id="login">
                <h2>Login</h2>
                <input type="email" placeholder="Email">
                <input type="password" placeholder="Password">
                <button class="form-btn">Login</button>
                <div style="margin-top:20px; text-align:center; color:#888;" onclick="document.getElementById('account').style.display='none'">Close</div>
            </div>
        </div>

    </div>

    <script>
        // Simple Tab Switching Logic
        function switchTab(tab) {
            // Reset buttons
            document.querySelectorAll('.menu button').forEach(b => b.classList.remove('active'));
            
            // Hide all main containers
            document.getElementById('artistcontainer').style.display = 'none';
            document.getElementById('settingsContainer').classList.add('hidden');
            
            if(tab === 'home') {
                document.getElementById('homebtn').classList.add('active');
                document.getElementById('artistcontainer').style.display = 'grid';
                document.getElementById('currentSection').innerText = 'Featured Artists';
            } else if (tab === 'settings') {
                document.getElementById('settingsbtn').classList.add('active');
                document.getElementById('settingsContainer').classList.remove('hidden');
                document.getElementById('currentSection').innerText = 'Settings';
            } else {
                // Just for demo
                document.getElementById('currentSection').innerText = tab.charAt(0).toUpperCase() + tab.slice(1);
            }
        }

        // Demo Player Logic
        function openPlayerDemo(artistName) {
            document.getElementById('playerContainer').classList.add('show');
            document.getElementById('playerArtist').innerText = artistName;
            document.getElementById('playerTitle').innerText = "Demo Song";
        }

        function closePlayer() {
            document.getElementById('playerContainer').classList.remove('show');
        }
    </script>
    <audio id="audioPlayer"></audio>

    <script src="Data.js"></script>
    <script src="galex.js"></script>

</body>
</html>
