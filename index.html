<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto-Redirect Platform</title>
    <style>
        /* General Styles */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        h1 { color: #333; margin-bottom: 10px; text-align: center; }
        .status-text { color: #666; margin-bottom: 40px; height: 20px; font-weight: 500;}

        /* Card Container */
        .card-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 30px;
            max-width: 1200px;
            width: 100%;
        }

        /* Card Styles */
        .card {
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 300px;
            padding: 30px;
            text-align: center;
            transition: all 0.3s ease;
            position: relative;
            opacity: 0.5; /* Fade out non-active cards */
            border: 2px solid transparent;
        }

        /* Active/Detected Card Style */
        .card.active {
            opacity: 1;
            transform: scale(1.1);
            border-color: #28a745;
            box-shadow: 0 15px 30px rgba(40, 167, 69, 0.2);
            z-index: 10;
        }

        /* Countdown Overlay */
        .countdown {
            display: none;
            position: absolute;
            top: 10px;
            right: 10px;
            background: #28a745;
            color: white;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            font-weight: bold;
            line-height: 30px;
            font-size: 14px;
        }

        .card.active .countdown { display: block; }

        .icon { font-size: 4rem; margin-bottom: 20px; display: block; }
        .card h2 { margin: 0 0 10px 0; color: #222; }
        .card p { color: #666; margin-bottom: 25px; }

        /* Buttons */
        .btn {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 6px;
            text-decoration: none;
            display: inline-block;
            cursor: pointer;
        }
        
        .btn:hover { background-color: #0056b3; }

        /* Mobile Fixes */
        @media (max-width: 768px) {
            .card { width: 100%; max-width: 350px; }
            .card.active { transform: scale(1.05); }
        }
    </style>
</head>
<body>

    <h1>Device Detection</h1>
    <div id="status" class="status-text">Scanning device type...</div>

    <div class="card-container">
        
        <div class="card" id="card-mobile">
            <div class="countdown" id="timer-mobile"></div>
            <span class="icon">📱</span>
            <h2>Mobile Web</h2>
            <p>Optimized for touch.</p>
            <a href="mobile.html" class="btn" id="btn-mobile">Go to Mobile</a>
        </div>

        <div class="card" id="card-pc">
            <div class="countdown" id="timer-pc"></div>
            <span class="icon">💻</span>
            <h2>PC Web</h2>
            <p>Optimized for desktop.</p>
             <a href="pc.html" class="btn" id="btn-pc">Go to Desktop</a>
        </div>

        <div class="card" id="card-tv">
            <div class="countdown" id="timer-tv"></div>
            <span class="icon">📺</span>
            <h2>Android TV</h2>
            <p>Optimized for remote.</p>
             <a href="tv.html" class="btn" id="btn-tv">Go to TV App</a>
        </div>

    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const userAgent = navigator.userAgent.toLowerCase();
            const statusText = document.getElementById('status');
            
            // Define Cards and Buttons
            const cards = {
                mobile: { el: document.getElementById('card-mobile'), btn: document.getElementById('btn-mobile'), timer: document.getElementById('timer-mobile') },
                pc: { el: document.getElementById('card-pc'), btn: document.getElementById('btn-pc'), timer: document.getElementById('timer-pc') },
                tv: { el: document.getElementById('card-tv'), btn: document.getElementById('btn-tv'), timer: document.getElementById('timer-tv') }
            };

            // 1. Detection Logic
            let detectedType = 'pc'; // Default fallback

            // Check for TV (Smart TVs, Android TV boxes, FireTV, etc.)
            if (userAgent.includes('smart-tv') || 
                userAgent.includes('smarttv') || 
                userAgent.includes('googletv') || 
                userAgent.includes('android tv') || 
                userAgent.includes('bravia') || 
                userAgent.includes('webos') ||
                userAgent.includes('dtv') ||
                userAgent.includes('viera') ||
                (userAgent.includes('android') && !userAgent.includes('mobile'))) {
                detectedType = 'tv';
            } 
            // Check for Mobile (Phones, tablets)
            else if (/iphone|ipad|ipod|android|blackberry|mini|windows\sce|palm/i.test(userAgent)) {
                detectedType = 'mobile';
            }

            // 2. Highlight Detected Card
            const target = cards[detectedType];
            
            // Remove 'active' from all, add to target
            Object.values(cards).forEach(c => c.el.classList.remove('active'));
            target.el.classList.add('active');
            
            // If TV, focus the card so remote buttons work immediately
            if(detectedType === 'tv') target.el.focus();

            statusText.innerText = `Detected: ${detectedType.toUpperCase()}. Auto-redirecting in 3 seconds...`;

            // 3. Countdown and Auto-Click
            let secondsLeft = 3;
            target.timer.innerText = secondsLeft;

            const countdownInterval = setInterval(() => {
                secondsLeft--;
                target.timer.innerText = secondsLeft;

                if (secondsLeft <= 0) {
                    clearInterval(countdownInterval);
                    statusText.innerText = "Redirecting...";
                    
                    // --- TRIGGER THE CLICK ---
                    console.log(`Auto-clicking ${detectedType} button`);
                    target.btn.click(); 
                    
                    // Fallback for demo purposes (Remove this in production if you use real links)
                    // This creates an alert just so you can see it worked if the link is empty
                    if(target.btn.getAttribute('href').startsWith('#')) {
                        alert(`Auto-clicked: ${detectedType.toUpperCase()} \n(Replace href="#" with your real URL)`);
                    }
                }
            }, 1000);
        });
    </script>

</body>
</html>
